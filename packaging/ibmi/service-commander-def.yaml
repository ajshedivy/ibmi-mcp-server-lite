# Service Commander (sc) unit definition, installed to
# /QOpenSys/etc/sc/services/ibmi-mcp-server-lite.yaml by the RPM.
#
# sc manages long-running daemons. Use --transport http for daemon mode;
# MCP_SERVER_ENV=production to deny all origins;
# check_alive probes the default HTTP port (3010).
#
# Mapepire credentials belong here (process env), not in a world-readable .env
# and not as a literal password in tools.yaml. After yum install, add to
# environment_vars on the installed unit (this file is %config(noreplace)):
#   - DB2i_HOST=your-ibmi.example.com
#   - DB2i_USER=youruser
#   - DB2i_PASS=your-password
# See docs/running-on-ibmi.md#daemon-credentials.
name: IBM i MCP Server Lite
dir: .
start_cmd: /QOpenSys/pkgs/bin/ibmi-mcp-server-lite --transport http --no-reload
check_alive: '3010'
batch_mode: 'true'
sbmjob_opts: 'JOBQ(QUSRNOMAX)'
environment_vars:
  - PATH=/QOpenSys/pkgs/bin:/QOpenSys/usr/bin:/usr/ccs/bin:/QOpenSys/usr/bin/X11:/usr/sbin:.:/usr/bin
  - MCP_SERVER_ENV=production
